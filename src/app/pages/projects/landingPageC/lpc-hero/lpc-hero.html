<section class="hero" id="lpc-inicio">
  <div class="hero__media" aria-hidden="true">
    <img
      src="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1800&q=70"
      alt=""
      width="1800"
      height="1200"
    />
  </div>
  <div class="hero__shade" aria-hidden="true"></div>
  <div class="hero__copy">
    <p class="lpc-hero__kicker">Estudio de arquitectura · Lima</p>
    <h1 class="lpc-hero__title">Espacios que se habitan, no solo se fotografían.</h1>
    <p class="lpc-hero__lead">
      Diseñamos casas y locales con luz, material y silencio. Un proceso claro, de la primera visita al último detalle.
    </p>
    <a class="lpc-hero__cta" href="#lpc-contacto" (click)="goContact($event)">Agendar una visita</a>
  </div>
</section>
